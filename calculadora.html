<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="calculadora">
        <h1>Calculadora Simples</h1>
        <div>
            <h2 id="resultado">Resultado: </h2>
        </div>
        <div id="teclas">
            
            <p class="numero">7</p>
            <p class="numero">8</p>
            <p class="numero">9</p>
            <p class="opera">-</p>
            
            <p class="numero">4</p>
            <p class="numero">5</p>
            <p class="numero">6</p>
            <p class="opera">+</p>
            
            <p class="numero">1</p>
            <p class="numero">2</p>
            <p class="numero">3</p>

            <p class="opera">/</p>
            <p class="clear">Clear</p>
            <p class="numero">0</p>
            <p class="calc">=</p>
            <p class="opera">x</p>

        </div>
    </div>
</body>
</html>
